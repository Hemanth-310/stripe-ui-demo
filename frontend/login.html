<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Car Showroom</title>
    <style>
        body {
            font-family: Arial;
            max-width: 400px;
            margin: 80px auto;
            padding: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<h1>🔐 Login</h1>

<form id="loginForm">
    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">Login</button>
</form>

<p id="message"></p>

<p>
    Don't have an account?
    <a href="register.html">Register</a>
</p>

<script>
const API_URL = "http://localhost:8000";

document.getElementById("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch(`${API_URL}/auth/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Login failed");
        }

        // Store JWT
        const token = data.data.access_token;

        localStorage.setItem("access_token", token);

        const payload = JSON.parse(
            atob(
                token.split(".")[1]
                    .replace(/-/g, "+")
                    .replace(/_/g, "/")
            )
        );

        const userId = payload.user_id;

        localStorage.setItem("user_id", userId);

        // Check whether the profile is already complete
        try {

            const profileResponse = await fetch(
                `${API_URL}/auth/profile?user_id=${encodeURIComponent(userId)}`,
                {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            const profileResult = await profileResponse.json();

            if (!profileResponse.ok) {
                throw new Error(
                    profileResult.detail ||
                    profileResult.message ||
                    "Unable to check profile."
                );
            }

            const profile = profileResult.data || profileResult;

            const profileComplete =
                Boolean(profile.first_name) &&
                Boolean(profile.last_name) &&
                Boolean(profile.email) &&
                Boolean(profile.phone_number);

            if (profileComplete) {
                window.location.href = "index.html";
            } else {
                window.location.href = "onboarding.html";
            }

        } catch (error) {

            console.error("Profile check failed:", error);

            // If profile cannot be verified, send user to onboarding
            window.location.href = "onboarding.html";
        }

    } catch (error) {

        document.getElementById("message").innerText =
            error.message;
    }
});
</script>

</body>
</html>
